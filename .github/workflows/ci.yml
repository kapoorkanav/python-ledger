name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledger_user
          POSTGRES_PASSWORD: ledger_pass
          POSTGRES_DB: ledger_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_db
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_db
        run: pytest -v -m "not integration"

  integration-test:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ping; then
              exit 0
            fi
            sleep 2
          done          
          echo "App did not become ready in time"
          docker compose logs app
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_db
          BASE_URL: http://localhost:8000
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: pytest -m integration -v

      - name: Tear down
        if: always()
        run: docker compose down -v