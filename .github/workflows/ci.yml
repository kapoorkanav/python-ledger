name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Unit and database tests
        runs-on: ubuntu-latest
        
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: ledger_user
                    POSTGRES_PASSWORD: ledger_pass
                    POSTGRES_DB: ledger_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_db
        
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
                cache: pip

            - name: Install dependencies
              run: pip install -r requirements-dev.txt

            - name: Run migrations
              run: alembic upgrade head

            - name: Verify models and migrations agree
              run: alembic check

            - name: Run tests
              run: pytest -v -m "not integration" --cov=app --cov-report=term-missing

    integration-test:
        name: Full-stack integration tests
        needs: test
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: postgresql://ledger_user:ledger_pass@localhost:5432/ledger_db
            KAFKA_BOOTSTRAP_SERVERS: localhost:9092
            BASE_URL: http://localhost:8000

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
                cache: pip

            - name: Install dependencies
              run: pip install -r requirements-dev.txt

            - name: Start full stack
              run: docker compose up -d --build

            - name: Wait for app to be ready
              run: |
                for i in $(seq 1 30); do
                  if curl -fsS "$BASE_URL/health"; then exit 0; fi
                  sleep 2
                done
                echo "App did not become ready in time"
                exit 1

            - name: Wait for outbox relay to be running
              run: |
                for i in $(seq 1 30); do
                  state=$(docker compose ps -q outbox_relay | xargs -r docker inspect -f '{{.State.Running}}')
                  if [ "$state" = "true" ]; then exit 0; fi
                  sleep 2
                done
                echo "Outbox relay did not start in time"
                exit 1

            - name: Run integration tests
              run: pytest -v -m integration

            - name: Dump stack logs
              if: failure()
              run: docker compose logs --no-color

            - name: Tear down
              if: always()
              run: docker compose down -v